services:
  - type: web
    name: swarmshop
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SHOP_ACCOUNT
        sync: false
      - key: CUSTOMER_ACCOUNT
        sync: false
      - key: NEAR_KEYS
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_MODEL_ACE
        sync: false
